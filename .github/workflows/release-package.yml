name: Release Package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://npm.pkg.github.com'
        # Defaults to the user or organization that owns the workflow file
        scope: '@cmu-sei'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert registry in package-lock.json
      run: npm run change-registry-in-package-lock

    - name: Cache dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}-${{ hashFiles('.nvmrc') }}

    - name: Verify version matches release tag
      run: |
        TAG="${{ github.event.release.tag_name }}"
        TAG="${TAG#v}"
        PKG_VERSION=$(node -p "require('./package.json').version")
        if [ "$TAG" != "$PKG_VERSION" ]; then
          echo "Error: Release tag ($TAG) does not match package.json version ($PKG_VERSION)"
          echo "Please ensure package.json is updated before creating the release"
          exit 1
        fi
        echo "✓ Version $PKG_VERSION matches release tag"

    - name: Install dependencies
      run: npm ci

    - name: Check whether version already published
      id: package
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(node -p "require('./package.json').version")
        PKG_NAME=$(node -p "require('./package.json').name")
        echo "Checking registry for $PKG_NAME@$VERSION"
        if npm --registry=https://npm.pkg.github.com view "$PKG_NAME@$VERSION" >/dev/null 2>&1; then
          echo "Version $VERSION already exists in registry - skipping publication"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Get current production version
      id: production
      run: |
        VERSION=$(git show HEAD^:package.json | jq -r .version)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Lint components
      if: steps.package.outputs.exists != 'true'
      run: npm run lint
    
    - name: Test components
      if: steps.package.outputs.exists != 'true'
      run: npm test
    
    - name: Build components
      if: steps.package.outputs.exists != 'true'
      run: |
        printf "\nbuilding all components...\n"
        LIB_NAME=SeiDesignSystem LIB_ROOT=src/components npx vite build --config vite-library.config.js
        npx vue-tsc --declaration --emitDeclarationOnly --outDir dist/types

    - name: Generate Volar types
      if: steps.package.outputs.exists != 'true'
      run: |
        # Generate ./volar.d.ts that adds Types for Global Components
        printf "\nGenerating Volar types for global components...\n"
        npm run gen-volar-dts

    - name: Build Storybook
      if: steps.package.outputs.exists != 'true'
      run: npm run build-storybook

    - name: Publish dry-run
      if: steps.package.outputs.exists != 'true'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm publish --dry-run

    - name: Publish package
      if: steps.package.outputs.exists != 'true'
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Trigger SDS Base production release
      env:
        GH_TOKEN: ${{ secrets.SDS_BASE_DISPATCH_TOKEN }}
        SDS_PREVIOUS_VERSION: ${{ steps.production.outputs.version }}
        SOURCE_RUN: ${{ github.run_id }}.${{ github.run_attempt }}
      run: |
        SDS_VERSION=$(node -p "require('./package.json').version")
        gh api --method POST repos/cmu-sei/sds-base/dispatches \
          -f event_type=sds-production-published \
          -F "client_payload[sds_previous_version]=$SDS_PREVIOUS_VERSION" \
          -F "client_payload[sds_version]=$SDS_VERSION" \
          -F "client_payload[source_run]=$SOURCE_RUN"
